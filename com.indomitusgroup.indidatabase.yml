app-id: com.indomitusgroup.indidatabase
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

command: indidatabase

finish-args:
  # Display (Tauri / WebKitGTK)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for the WebKitGTK webview
  - --device=dri
  # Outbound network needed for multi-user access over local network and license upgrades
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop
  - --filesystem=xdg-download
  # Keyring (Secret Service), so paired computers stay paired across restarts
  - --talk-name=org.freedesktop.secrets

modules:
  - name: indidatabase
    buildsystem: simple
    build-commands:
      - install -Dm755 indidatabase ${FLATPAK_DEST}/bin/indidatabase
      # The command-line companion for other programs:
      # flatpak run --command=indidatabase-cli com.indomitusgroup.indidatabase …
      - install -Dm755 indidatabase-cli ${FLATPAK_DEST}/bin/indidatabase-cli
      - install -Dm644 com.indomitusgroup.indidatabase.desktop ${FLATPAK_DEST}/share/applications/com.indomitusgroup.indidatabase.desktop
      - install -Dm644 com.indomitusgroup.indidatabase.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.indomitusgroup.indidatabase.metainfo.xml
      - install -Dm644 icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/com.indomitusgroup.indidatabase.png
      - install -Dm644 icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.indomitusgroup.indidatabase.png
      - install -Dm644 icons/256x256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/com.indomitusgroup.indidatabase.png
      - install -Dm644 icons/512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.indomitusgroup.indidatabase.png
      # The license agreement, where Flathub requires licenses to be.
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}
    sources:
      - type: archive
        url: https://downloads.indomitusgroup.com/indidatabase/indidatabase-1.6.0-linux-x86_64.tar.gz
        sha256: a7d1ae72c340248eda89d7c4358bc35ca698b44a41d4f8222cc5747f230f8f2e
